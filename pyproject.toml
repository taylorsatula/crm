[project]
name = "crm"
version = "0.1.0"
description = "CRM and appointment scheduling API for service businesses"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic[email]>=2.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "redis>=5.0",
    "hvac>=2.0",
    "requests>=2.32",
    "openai>=1.109.1",
    "json-repair>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
